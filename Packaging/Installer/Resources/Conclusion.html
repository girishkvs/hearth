<h2>Open Hearth</h2>
<p>Open Finder &gt; Applications and double-click Hearth.
Click the flame icon in the menu bar to use its controls.</p>
<p>From Terminal:</p>
<p><code>open /Applications/Hearth.app</code></p>
<p>Hearth runs in the menu bar, not the Dock. Your sleep settings are unchanged.</p>
