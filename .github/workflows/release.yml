name: Release

"on":
  push:
    tags: ["v[0-9]*.[0-9]*.[0-9]*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify release version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="$(head -n 1 VERSION)"
          if [ "$EVENT_NAME" = push ]; then
            test "$REF_NAME" = "v$version"
            test "$(git rev-parse "refs/tags/$REF_NAME^{commit}")" = "$(git rev-parse HEAD)"
            echo "RELEASE_TAG=$REF_NAME" >> "$GITHUB_ENV"
          fi
          scripts/sync-version.sh
          git diff --exit-code
      - name: Test without privileged installation
        run: |
          test "$(id -u)" -ne 0
          swift test --disable-automatic-resolution
          .build/debug/HearthApp --smoke-test
      - name: Prepare source and local-build packages
        run: scripts/prepare-release.sh --output-dir "$PWD/dist/release"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reviewed-release-artifacts
          path: dist/release/
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: reviewed-release-artifacts
          path: release
      - name: Publish only verified versioned artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          cd release
          sha256sum -c SHA256SUMS.txt
          version="${RELEASE_TAG#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test -f "hearth-$version-source.tar.gz"
          shopt -s nullglob
          setup=(hearth-"$version"-macos-*-local-setup.pkg)
          remove=(hearth-"$version"-macos-*-local-remove.pkg)
          test "${#setup[@]}" -eq 1
          test "${#remove[@]}" -eq 1
          gh release create "$RELEASE_TAG" --verify-tag --title "Hearth $version" \
            --notes-file RELEASE-NOTES.md \
            "${setup[0]}" "${remove[0]}" "hearth-$version-source.tar.gz" \
            BUILD-INFO.txt RELEASE-NOTES.md SHA256SUMS.txt
